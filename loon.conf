# =====================================
# 脚本（忠实移植自 Surge 模块 Maasea YouTube.Enhance）
# =====================================

[Script]
# YouTube + YouTube Music 去广告/后台播放。关键：max-size=-1 不限响应体（否则大 protobuf 被截断→后台播放失效），timeout 调大给大 body 留处理时间。脚本三端通用(Surge/Loon/QuanX)，缺 argument 会安全用默认值
http-response ^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch))(\?(.*))?$ script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js, requires-body=true, binary-body-mode=true, max-size=-1, timeout=30, tag=YouTubeMusicEnhance

# Spotify 解锁 Premium——内联 BOBO 的 JS（绕开 BOBO plugin 缺 max-size=-1 的 bug）。
# 关键参数：max-size=-1 不限响应体（bootstrap protobuf 很大，1MB 默认上限会截断 →
# 反序列化失败 → 账号能力位改不掉 → 还是 free，仍弹 Premium 升级提示）。
# timeout=30 给大 body 处理留时间。Premium fork 链：app2smile → daozen → BOBO
# （后者 2026-05 最活跃）。BOBO 哪天失效，把 daozen URL 换回去即可（同架构）
#
# 2026-05 hostname 放宽：Spotify 启用了地区子域名 guc3-spclient.spotify.com（无 wg），
# 旧 pattern 的三段 alt 写法不够灵活——改用 [\w-]*spclient[\w.-]*\.spotify\.com 通配
# 所有 spclient 变种（spclient.wg / gae2-spclient.wg / guc3-spclient / 未来的 XX-spclient 等）
http-request ^https:\/\/[\w-]*spclient[\w.-]*\.spotify\.com\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/ script-path=https://raw.githubusercontent.com/BOBOLAOSHIV587/Rules/main/JS/Spotify/JS/JS-1/Spotify-Json.js, timeout=10, tag=spotifyJson
http-response ^https:\/\/[\w-]*spclient[\w.-]*\.spotify\.com\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$ script-path=https://raw.githubusercontent.com/BOBOLAOSHIV587/Rules/main/JS/Spotify/JS/JS-1/Spotify-Proto.js, requires-body=true, binary-body-mode=true, max-size=-1, timeout=30, tag=spotifyProto

[Rewrite]
# YouTube 视频前贴广告（initplayback &oad）返回空 200（对应 Surge 模块的 [Map Local]）
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad reject-200
# Spotify customize 端点去掉 If-None-Match 头，强制返回 200+完整 body 给上方 [Script] 的 Spotify-Proto.js
# （否则 Spotify 走 304 Not Modified 时没 body，脚本拿不到 protobuf 改不了能力位）。
# hostname 通配同 [Script] 段，覆盖 guc3-/gae2- 等地区前缀
^https:\/\/[\w-]*spclient[\w.-]*\.spotify\.com\/user-customization-service\/v1\/customize$ header-del if-none-match

[Mitm]
# weibo 各子域用 *.weibo.com / *.weibo.cn 统一覆盖（替代原 Surge 式裸前缀写法）；
# *-redirector.googlevideo.com 已被 *.googlevideo.com 通配覆盖，无需单列
hostname = sub.store,*.weibo.com,*.weibo.cn,*.googlevideo.com,www.youtube.com,s.youtube.com,youtubei.googleapis.com,spclient.wg.spotify.com,gae2-spclient.wg.spotify.com,*spclient.spotify.com,app.bilibili.com,grpc.biliapi.net,api.zhihu.com,www.zhihu.com,appcloud2.zhihu.com,tiebac.baidu.com,news.ssp.qq.com,r.inews.qq.com,boxer.baidu.com