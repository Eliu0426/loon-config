# =====================================
# 脚本（忠实移植自 Surge 模块 Maasea YouTube.Enhance）
# =====================================

[Script]
# YouTube + YouTube Music 去广告/后台播放。关键：max-size=-1 不限响应体（否则大 protobuf 被截断→后台播放失效），timeout 调大给大 body 留处理时间。脚本三端通用(Surge/Loon/QuanX)，缺 argument 会安全用默认值
http-response ^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch))(\?(.*))?$ script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js, requires-body=true, binary-body-mode=true, max-size=-1, timeout=30, tag=YouTubeMusicEnhance

# Spotify 部分解锁（daozen fork 真正修复版）：处理"点歌弹 Premium / 强制随机播放 / 每日配额"。
# 上方 [Plugin] 的 app2smile spotify.plugin 已停用。这里直接引 daozen 自己仓库里更新过的 js，
# 不走他写错的 .plugin。max-size=-1/timeout=30 同 YouTube 那条理由：protobuf 大 body 别被截断
http-request ^https:\/\/(spclient\.wg\.spotify\.com|gae2-spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/ script-path=https://raw.githubusercontent.com/daozen/rules/master/js/spotify-json.js, timeout=10, tag=spotifyJson
http-response ^https:\/\/(spclient\.wg\.spotify\.com|gae2-spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$ script-path=https://raw.githubusercontent.com/daozen/rules/master/js/spotify-proto.js, requires-body=true, binary-body-mode=true, max-size=-1, timeout=30, tag=spotifyProto

[Rewrite]
# YouTube 视频前贴广告（initplayback &oad）返回空 200（对应 Surge 模块的 [Map Local]）
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad reject-200
# Spotify customize 端点去掉 If-None-Match 头，强制返回 200+完整 body 给下面的 spotify-proto.js 重写
^https:\/\/(spclient\.wg\.spotify\.com|gae2-spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ header-del if-none-match

[Mitm]
# weibo 各子域用 *.weibo.com / *.weibo.cn 统一覆盖（替代原 Surge 式裸前缀写法）；
# *-redirector.googlevideo.com 已被 *.googlevideo.com 通配覆盖，无需单列
hostname = sub.store,*.weibo.com,*.weibo.cn,*.googlevideo.com,www.youtube.com,s.youtube.com,youtubei.googleapis.com,spclient.wg.spotify.com,gae2-spclient.wg.spotify.com,*spclient.spotify.com,app.bilibili.com,grpc.biliapi.net,api.zhihu.com,www.zhihu.com,appcloud2.zhihu.com,tiebac.baidu.com,news.ssp.qq.com,r.inews.qq.com,boxer.baidu.com
